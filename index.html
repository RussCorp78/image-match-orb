<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Image Match Proof of Concept</title>

</head>
<body>

<h1>Image Match v1.1</h1>
<div id="status">Loading OpenCV…</div>

<div id="cameraWrap">
  <video id="video" autoplay playsinline muted></video>
  <div id="guide"></div>
</div>

<button id="startBtn">Start camera</button>
<button id="stopBtn">Stop</button>

<div id="result">Point the camera at a reference image.</div>

<div id="details">
  <b>Known images:</b> <span id="knownImages">—</span><br>
  <b>Current best match:</b> <span id="bestMatch">—</span><br>
  <b>Good matches:</b> <span id="goodMatches">—</span><br>
  <b>Verified matches:</b> <span id="verifiedMatches">—</span>
</div>

<div id="infoModal">
  <div id="infoCard">
    <h2 id="infoTitle">Match found</h2>
    <p id="infoText"></p>
    <a id="openLink" href="#" target="_blank" rel="noopener">Open webpage</a>
    <button id="closeModal">Close</button>
  </div>
</div>

<canvas id="canvas"></canvas>

<script async src="https://docs.opencv.org/4.x/opencv.js"></script>
<script>
let video, canvas, ctx;
let stream = null;
let running = false;
let referenceImages = [];
let orb = null;
let lastProcess = 0;
let matchLockUntil = 0;
let popupShown = false;
let currentMatchedId = null;
let waitingForNewMatch = false;
let clearCounter = 0;

const statusEl = document.getElementById("status");
const resultEl = document.getElementById("result");
const bestMatchEl = document.getElementById("bestMatch");
const goodMatchesEl = document.getElementById("goodMatches");
const verifiedMatchesEl = document.getElementById("verifiedMatches");

function setStatus(text, cls="") {
  statusEl.textContent = text;
  statusEl.className = cls;
}

function opencvReady() {
  return typeof cv !== "undefined" && cv.Mat;
}

async function loadMatchData() {
  const response = await fetch("data.json?t=" + Date.now());
  const data = await response.json();

  if (!data.matches || !data.matches.length) {
    throw new Error("No matches found in data.json");
  }

  referenceImages = [];

  for (const item of data.matches) {
    const img = await loadImage(item.image);
    const temp = document.createElement("canvas");
    const max = 1000;
    const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    temp.width = Math.round(img.naturalWidth * scale);
    temp.height = Math.round(img.naturalHeight * scale);
    temp.getContext("2d").drawImage(img, 0, 0, temp.width, temp.height);

    const mat = cv.imread(temp);
    const gray = new cv.Mat();
    cv.cvtColor(mat, gray, cv.COLOR_RGBA2GRAY);

    const keypoints = new cv.KeyPointVector();
    const descriptors = new cv.Mat();
    orb.detectAndCompute(gray, new cv.Mat(), keypoints, descriptors);

    referenceImages.push({
      data: item,
      gray: gray,
      keypoints: keypoints,
      descriptors: descriptors
    });

    mat.delete();
  }

  document.getElementById("knownImages").textContent = referenceImages.length;
  setStatus("Ready — start the camera");
}

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error("Could not load " + src));
    img.src = src;
  });
}

function startCamera() {
  if (!referenceImages.length) {
    resultEl.textContent = "Reference images are still loading.";
    return;
  }

  navigator.mediaDevices.getUserMedia({
    video: {
      facingMode: { ideal: "environment" },
      width: { ideal: 1280 },
      height: { ideal: 720 }
    },
    audio:false
  }).then(s => {
    stream = s;
    video.srcObject = stream;
    running = true;
    waitingForNewMatch = false;
    currentMatchedId = null;
    setStatus("Camera running — point at an image");
    resultEl.textContent = "Looking for a match…";
    requestAnimationFrame(loop);
  }).catch(err => {
    setStatus("Camera could not start", "warn");
    resultEl.textContent = err.name + ": " + err.message;
  });
}

function stopCamera() {
  running = false;
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  setStatus("Camera stopped");
}

function findBestMatch(frameGray) {
  let best = null;

  for (const ref of referenceImages) {
    if (ref.descriptors.empty()) continue;

    const kp = new cv.KeyPointVector();
    const desc = new cv.Mat();
    orb.detectAndCompute(frameGray, new cv.Mat(), kp, desc);

    if (desc.empty()) {
      kp.delete(); desc.delete();
      continue;
    }

    const matcher = new cv.BFMatcher(cv.NORM_HAMMING, false);
    const knn = new cv.DMatchVectorVector();
    matcher.knnMatch(ref.descriptors, desc, knn, 2);

    let good = 0;
    const srcPts = [];
    const dstPts = [];

    for (let i=0; i<knn.size(); i++) {
      const pair = knn.get(i);
      if (pair.size() >= 2) {
        const m1 = pair.get(0), m2 = pair.get(1);
        if (m1.distance < 0.72 * m2.distance) {
          good++;
          const a = ref.keypoints.get(m1.queryIdx).pt;
          const b = kp.get(m1.trainIdx).pt;
          srcPts.push(a.x,a.y);
          dstPts.push(b.x,b.y);
        }
      }
    }

    let verified = 0;
    if (good >= 8) {
      const src = cv.matFromArray(good,1,cv.CV_32FC2,srcPts);
      const dst = cv.matFromArray(good,1,cv.CV_32FC2,dstPts);
      const mask = new cv.Mat();
      try {
        cv.findHomography(src,dst,cv.RANSAC,5,mask);
        for (let i=0; i<mask.rows; i++) if (mask.data[i]) verified++;
      } catch(e) {}
      src.delete(); dst.delete(); mask.delete();
    }

    if (!best || verified > best.verified || (verified === best.verified && good > best.good)) {
      best = { ref, good, verified };
    }

    knn.delete(); matcher.delete(); kp.delete(); desc.delete();
  }

  return best;
}

function showInfoPopup(item) {
  document.getElementById("infoTitle").textContent = item.name || "Match found";
  document.getElementById("infoText").textContent = item.info || "";

  const link = document.getElementById("openLink");
  if (item.url) {
    link.href = item.url;
    link.style.display = "inline-block";
  } else {
    link.style.display = "none";
  }

  document.getElementById("infoModal").style.display = "flex";
  popupShown = true;
}

function closeInfoPopup() {
  document.getElementById("infoModal").style.display = "none";
  popupShown = false;

  // Clear "match found" immediately after closing.
  resultEl.textContent = "Looking for a new match…";
  resultEl.className = "";
  setStatus("Camera running — point at another image");

  // Don't immediately reopen while the same image is still in view.
  waitingForNewMatch = true;
  clearCounter = 0;
}

function processFrame() {
  if (!video.videoWidth || !referenceImages.length) return;

  const maxWidth = 900;
  const scale = Math.min(1, maxWidth / video.videoWidth);
  canvas.width = Math.round(video.videoWidth * scale);
  canvas.height = Math.round(video.videoHeight * scale);
  ctx.drawImage(video,0,0,canvas.width,canvas.height);

  const frame = cv.imread(canvas);
  const gray = new cv.Mat();
  cv.cvtColor(frame,gray,cv.COLOR_RGBA2GRAY);

  const best = findBestMatch(gray);

  if (best) {
    bestMatchEl.textContent = best.ref.data.name || best.ref.data.id;
    goodMatchesEl.textContent = best.good;
    verifiedMatchesEl.textContent = best.verified;

    const isStrong = best.verified >= 12 && best.good >= 18;

    if (waitingForNewMatch) {
      // Require several consecutive weak frames before re-arming.
      if (!isStrong) {
        clearCounter++;
        if (clearCounter >= 4) {
          waitingForNewMatch = false;
          currentMatchedId = null;
          clearCounter = 0;
          resultEl.textContent = "Looking for a match…";
        }
      } else {
        clearCounter = 0;
      }
    } else if (isStrong && Date.now() > matchLockUntil) {
      const id = best.ref.data.id;

      if (id !== currentMatchedId && !popupShown) {
        currentMatchedId = id;
        resultEl.textContent = "✓ IMAGE MATCHED";
        resultEl.className = "match";
        setStatus("Match found!", "match");
        matchLockUntil = Date.now() + 2500;
        showInfoPopup(best.ref.data);
      }
    }
  }

  frame.delete();
  gray.delete();
}

function loop(now) {
  if (!running) return;
  if (now-lastProcess > 300) {
    lastProcess = now;
    try { processFrame(); } catch(e) { console.log(e); }
  }
  requestAnimationFrame(loop);
}

async function init() {
  video = document.getElementById("video");
  canvas = document.getElementById("canvas");
  ctx = canvas.getContext("2d");
  orb = new cv.ORB(1200);

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setStatus("This browser does not provide camera access","warn");
    return;
  }

  try {
    await loadMatchData();
  } catch(e) {
    setStatus(e.message,"warn");
    console.error(e);
  }
}

document.getElementById("startBtn").onclick = startCamera;
document.getElementById("stopBtn").onclick = stopCamera;
document.getElementById("closeModal").onclick = closeInfoPopup;
document.getElementById("infoModal").onclick = e => {
  if (e.target.id === "infoModal") closeInfoPopup();
};

const waitForOpenCV = setInterval(() => {
  if (opencvReady()) {
    clearInterval(waitForOpenCV);
    init();
  }
},100);
</script>
</body>
</html>
